name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Disparado pelo /admin/blog (joga-diagnostico-api) ao publicar/editar/tirar artigo do ar.
  repository_dispatch:
    types: [blog-atualizado]

# Dois "Publicar" seguidos: o build mais novo cancela o anterior (ele lê a API inteira de
# novo, então já leva tudo).
concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy no servidor por SSH com uma chave que SÓ consegue rodar o script de deploy
      # (forced command no authorized_keys). Sem os secrets, o passo é pulado e o deploy
      # continua manual — ver README, "Deploy automático".
      - name: Deploy no servidor
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::warning::Secrets de deploy ausentes — imagem publicada, deploy NÃO feito (rodar o docker service update à mão)."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${DEPLOY_USER:-joaogabriel}@${DEPLOY_HOST}" deploy

      - name: Conferir o site no ar
        if: success()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          [ -z "$DEPLOY_HOST" ] && exit 0
          for i in $(seq 1 18); do
            if curl -fsS https://jogasolucoes.com.br/health >/dev/null; then echo "site ok"; exit 0; fi
            sleep 10
          done
          echo "::error::site não respondeu /health depois do deploy"; exit 1
